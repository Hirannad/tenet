# What a runner can check. `claude plugin validate` needs the CLI and stays a release step.
name: checks
on: [push, pull_request]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v

      - name: JSON validity
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1])); print('ok', sys.argv[1])" "$f"
          done

      - name: Invariants
        # A skill's ! block may expand nothing but ${CLAUDE_PLUGIN_ROOT}: anything else makes the
        # preprocessor reject the block and load the skill without its body. hooks.json names no
        # store path: tenet/paths.py is the only resolver.
        run: |
          bad=0
          for f in skills/*/SKILL.md; do
            awk '/^```!/{f=1;next} /^```/{f=0} f{l=$0; gsub(/\$\{CLAUDE_PLUGIN_ROOT\}/,"",l); if (l ~ /\$/) {print FILENAME": "$0; b=1}} END{exit b}' "$f" || bad=1
          done
          if grep -nE 'Claude/|TENET_LEDGER|CLAUDE_PLUGIN_OPTION_' hooks/hooks.json; then bad=1; fi
          exit $bad

      - name: Frontmatter, every tracked markdown file
        run: python3 tenet/cli.py audit frontmatter .

      - name: layer-check reports absent layers as absent, never as zero
        run: |
          set -euo pipefail
          out=$(python3 tenet/cli.py audit layers .)
          echo "$out" | grep -qE '^  measured +project \./CLAUDE\.md'
          echo "$out" | grep -qE '^  absent +user CLAUDE\.md'
          empty=$(mktemp -d); cfg=$(mktemp -d)
          CLAUDE_CONFIG_DIR="$cfg" python3 tenet/cli.py audit layers "$empty" | grep -q 'This is not a budget of zero'
